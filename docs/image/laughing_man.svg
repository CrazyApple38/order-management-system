  <!-- Combined text on inner path, single rotation -->
  <g class="inner-ring">
    <text font-family="'Arial Narrow','Impact','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="26" fill="#004b73"
          letter-spacing="1.6" opacity="0.75">
      <textPath href="#innerTextPath" startOffset="0%">
        I thought what I'd do was, I'd pretend I was one of those deaf-mutes. ★ I thought what I'd do was, I'd pretend I was one of those deaf-mutes. ★ 
      </textPath>
    </text>
  </g>

</svg>
