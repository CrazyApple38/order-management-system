<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <style>
      @keyframes spin  { from{transform:rotate(0deg)}  to{transform:rotate(360deg)} }
      @keyframes spinR { from{transform:rotate(0deg)}  to{transform:rotate(-360deg)} }
      @keyframes glow  { 0%,100%{opacity:1} 50%{opacity:0.78} }
      .outer-ring { transform-origin:250px 250px; animation:spin  9s linear infinite }
      .inner-ring { transform-origin:250px 250px; animation:spinR 13s linear infinite }
      .logo-body  { animation:glow 3s ease-in-out infinite }
    </style>

    <!-- Text ring paths (canvas space, centered 250,250) -->
    <path id="outerTextPath" d="M250,250 m-192,0 a192,192 0 1,0 384,0 a192,192 0 1,0 -384,0"/>
    <path id="innerTextPath" d="M250,250 m-166,0 a166,166 0 1,0 332,0 a166,166 0 1,0 -332,0"/>
  </defs>

  <!-- ================================================================
       Logo group — everything scaled×4.5 and centered at canvas(250,250).
       ================================================================ -->
