<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社員週間予定表 - 受注管理システム</title>
    <link rel="stylesheet" href="mockup/co-shared-badges.css">
    <link rel="stylesheet" href="mockup/co-navbar.css">
    <link rel="stylesheet" href="mockup/weekly-schedule.css">
</head>
<body>
    <!-- co-navbar.js が自動挿入 -->

    <div class="md-ws-container">
        <!-- ヘッダー -->
        <div class="md-ws-header">
            <span class="md-ws-header-title">社員週間予定表</span>

            <span class="md-ws-year-label" id="wsYearLabel">2026年</span>

            <div class="md-ws-header-nav">
                <button class="md-ws-nav-btn" id="wsPrevWeek" title="前の週">◀前週</button>
                <button class="md-ws-nav-btn" id="wsPrevDay" title="前の日">◀前日</button>
                <span class="md-ws-month-label" id="wsMonthLabel">4月6日～4月12日</span>
                <button class="md-ws-nav-btn" id="wsNextDay" title="次の日">翌日▶</button>
                <button class="md-ws-nav-btn" id="wsNextWeek" title="次の週">翌週▶</button>
            </div>

            <button class="md-ws-today-btn" id="wsTodayBtn">今日</button>

            <div class="md-ws-header-spacer"></div>
        </div>

        <!-- ツールバー -->
        <div class="md-ws-toolbar">
            <button class="md-tb-btn">
                <img src="mockup/icons/eye.svg" alt="">フィルター
            </button>
            <span class="md-ws-tb-sep"></span>
            <button class="md-tb-btn">
                <img src="mockup/icons/person.svg" alt="">グループ管理
            </button>
            <span class="md-ws-tb-sep"></span>
            <button class="md-tb-btn md-ws-gc-filter-btn" id="wsGcFilterBtn">
                <span id="wsGcFilterLabel">すべて</span>
                <span class="md-ws-gc-arrow">▼</span>
            </button>
        </div>

        <!-- メインエリア -->
        <div class="md-ws-main">
            <!-- グリッド -->
            <div class="md-ws-grid-wrapper" id="wsGridWrapper">
                <div class="md-ws-grid" id="wsGrid">
                    <!-- JS で描画 -->
                </div>
            </div>

            <!-- サイドバー -->
            <div class="md-ws-sidebar">
                <div class="md-ws-sidebar-header">
                    <img src="mockup/icons/calendar.svg" alt="" style="width:16px;height:16px;filter:brightness(10);">
                    <span class="md-ws-sidebar-date" id="wsSidebarDate">4月9日</span>
                    <span class="md-ws-sidebar-dow" id="wsSidebarDow">(木)</span>
                    <span style="flex:1;"></span>
                    <span class="md-ws-employee-count" id="wsEmpCount"></span>
                </div>
                <div class="md-ws-sidebar-body" id="wsSidebarBody">
                    <!-- JS で描画 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 表示グループ会社モーダル -->
    <div class="md-ws-modal-overlay" id="wsGcFilterModal">
        <div class="md-ws-modal-content">
            <div class="md-ws-modal-header">
                <h3>表示グループ会社</h3>
                <button class="md-ws-modal-close" id="wsGcFilterClose">&times;</button>
            </div>
            <div class="md-ws-modal-body">
                <p class="md-ws-modal-hint">チェックを入れた会社の現場・社員が表示されます</p>
                <div class="md-ws-gcf-checkboxes" id="wsGcFilterChecks"></div>
            </div>
            <div class="md-ws-modal-footer">
                <button class="md-ws-modal-btn md-ws-modal-btn-cancel" id="wsGcFilterCancel">キャンセル</button>
                <button class="md-ws-modal-btn md-ws-modal-btn-apply" id="wsGcFilterApply">適用</button>
            </div>
        </div>
    </div>

    <script src="mockup/demo-data.js"></script>
    <script src="mockup/co-navbar.js"></script>
    <script src="mockup/weekly-schedule.js"></script>
</body>
</html>
