    <!-- co-navbar.js が自動挿入 -->

    <div class="app ws-app">
        <!-- ツールバー（濃色帯はメニューバー1段のみ・タイトルはここへ統合） -->
        <div class="toolbar md-ws-toolbar" role="toolbar" aria-label="週間予定表操作バー">
            <span class="md-ws-header-title">週間予定表</span>
            <!-- 現場軸/社員軸トグルは JS(injectViewToggle) がタイトル直後に挿入 -->
            <div class="md-ws-nav-group">
                <button type="button" class="md-ws-nav-btn" id="wsPrevWeek" aria-label="前週" title="前週"><svg class="ui-icon" aria-hidden="true"><use href="#ui-icon-chevrons-left"/></svg></button>
                <button type="button" class="md-ws-nav-btn" id="wsPrevDay" aria-label="前日" title="前日"><svg class="ui-icon" aria-hidden="true"><use href="#ui-icon-chevron-left"/></svg></button>
                <span class="md-ws-month-label" id="wsMonthLabel">2026年 4月27日～5月3日</span>
                <button type="button" class="md-ws-nav-btn" id="wsNextDay" aria-label="翌日" title="翌日"><svg class="ui-icon" aria-hidden="true"><use href="#ui-icon-chevron-right"/></svg></button>
                <button type="button" class="md-ws-nav-btn" id="wsNextWeek" aria-label="翌週" title="翌週"><svg class="ui-icon" aria-hidden="true"><use href="#ui-icon-chevrons-right"/></svg></button>
            </div>
            <button type="button" class="md-ws-today-btn" id="wsTodayBtn">今日</button>
            <span class="toolbar-sep"></span>
            <button type="button" class="md-ws-today-btn" onclick="OmsMockStore.resetAndReload()" title="共通ダミーデータを初期状態に戻す">データリセット</button>
            <span class="md-ws-toolbar-spacer"></span>
            <div class="stat-strip" id="wsStatStrip" role="group" aria-label="週間予定表サマリ"></div>
        </div>

        <!-- ワークスペース: rail | main | prop -->
        <div class="workspace ws-workspace">
            <!-- 左レール（R-3c-3 で統合ベル cn-card を移設） -->
            <aside class="rail" aria-label="週間予定表レール"></aside>

            <!-- 中央: 週配置ボード -->
            <section class="main">
                <div class="main-card">
                    <div class="main-head">
                        <span class="main-title">現場配置表</span>
                        <span class="main-hint" id="wsMainHint">セル選択で配置編集は右パネルへ。現場軸/社員軸はツールバーで切替。</span>
                    </div>
                    <div class="md-ws-grid-wrapper" id="wsGridWrapper">
                        <div class="md-ws-grid" id="wsGrid">
                            <!-- JS で描画 -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- 右プロパティ（R-3c-2a: panel-rail 4モードで中身を切替） -->
            <aside class="prop" aria-label="週間予定表右プロパティ">
                <div class="md-ws-sidebar">
                    <!-- 中身は renderSidebar が wsPropMode に応じて描画 -->
                </div>
            </aside>

            <!-- 右パネル切替（panel-rail 4モード） -->
            <aside class="panel-rail" aria-label="右パネル切替">
                <button type="button" data-prop="cell" title="選択セル" aria-label="選択セル"><span class="md-ws-pr-label">セル</span></button>
                <button type="button" class="active" data-prop="employee" title="社員" aria-label="社員"><span class="md-ws-pr-label">社員</span></button>
                <button type="button" data-prop="vehicle" title="車両" aria-label="車両"><span class="md-ws-pr-label">車両</span></button>
                <button type="button" data-prop="support" title="協力業者・応援予約" aria-label="協力業者・応援予約"><span class="md-ws-pr-label">応援</span></button>
            </aside>
        </div>
    </div>

    <!-- GCフィルタモーダルは共通ナビバー(co-navbar.js)に移動 -->

    <script src="mockup/co-navbar.js?v=22"></script>
    <script src="mockup/weekly-schedule.js?v=21"></script>
</body>
</html>
