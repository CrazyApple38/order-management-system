<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>週間予定表 - 受注管理システム</title>
    <link rel="stylesheet" href="mockup/co-tokens.css">
    <link rel="stylesheet" href="mockup/co-forms.css">
    <link rel="stylesheet" href="mockup/co-buttons.css">
    <link rel="stylesheet" href="mockup/co-modal.css">
    <link rel="stylesheet" href="mockup/co-shared-badges.css">
    <link rel="stylesheet" href="mockup/co-navbar.css?v=4">
    <link rel="stylesheet" href="mockup/co-notify-panel.css?v=8">
    <link rel="stylesheet" href="mockup/weekly-schedule.css?v=2">
</head>
<body>

    <!-- co-navbar.js が自動挿入 -->

    <div class="md-ws-container">
        <!-- ヘッダー -->
        <div class="md-ws-header">
            <span class="md-ws-header-title">週間予定表</span>
            <div class="md-ws-header-spacer"></div>
        </div>

        <!-- ツールバー -->
        <div class="md-ws-toolbar">
            <!-- 現場軸/社員軸 トグルは JS が左端に挿入 -->
            <div class="md-ws-nav-group">
                <button type="button" class="md-ws-nav-btn" id="wsPrevWeek" aria-label="前週" title="前週"><svg class="ui-icon" aria-hidden="true"><use href="#ui-icon-chevrons-left"/></svg></button>
                <button type="button" class="md-ws-nav-btn" id="wsPrevDay" aria-label="前日" title="前日"><svg class="ui-icon" aria-hidden="true"><use href="#ui-icon-chevron-left"/></svg></button>
                <span class="md-ws-month-label" id="wsMonthLabel">2026年 4月6日～12日</span>
                <button type="button" class="md-ws-nav-btn" id="wsNextDay" aria-label="翌日" title="翌日"><svg class="ui-icon" aria-hidden="true"><use href="#ui-icon-chevron-right"/></svg></button>
                <button type="button" class="md-ws-nav-btn" id="wsNextWeek" aria-label="翌週" title="翌週"><svg class="ui-icon" aria-hidden="true"><use href="#ui-icon-chevrons-right"/></svg></button>
            </div>
            <button type="button" class="md-ws-today-btn" id="wsTodayBtn">今日</button>

            <!-- 変更通知（業務管理計画書） -->
            <div class="cn-anchor md-ws-cn-anchor" id="wsCnAnchor">
                <button type="button" class="cn-trigger" id="wsCnNotifyBtn" title="変更通知（業務管理計画書）" aria-label="業務管理計画書の変更通知を開く">
                    <img src="mockup/icons/bell.svg" alt="">
                    <span class="cn-trigger-badge" id="wsCnBadge" hidden>0</span>
                </button>
                <div class="cn-panel" id="wsCnPanel">
                    <div class="cn-head">
                        <span class="cn-title">変更通知</span>
                        <button type="button" class="cn-mark-all">すべて既読にする</button>
                    </div>
                    <div class="cn-tabs">
                        <button type="button" class="cn-tab is-active" data-tab="latest">最新</button>
                        <button type="button" class="cn-tab" data-tab="history">履歴</button>
                    </div>
                    <!-- 最新タブ -->
                    <div class="cn-tab-view is-active" data-tab="latest">
                        <div class="cn-body cn-body--latest" id="wsCnLatestBody">
                            <div class="cn-empty">変更通知はありません</div>
                        </div>
                    </div>
                    <!-- 履歴タブ (縦サブタブ: 現場名 / アカウント) -->
                    <div class="cn-tab-view" data-tab="history">
                        <div class="cn-history-layout">
                            <div class="cn-side-tabs">
                                <button type="button" class="cn-side-tab is-active" data-view="site">現場名</button>
                                <button type="button" class="cn-side-tab" data-view="account">アカウント</button>
                            </div>
                            <div class="cn-history-main">
                                <div class="cn-history-view is-active" data-view="site">
                                    <div class="cn-history-toolbar">
                                        <div class="cn-search-row">
                                            <div class="cn-search">
                                                <input type="text" placeholder="契約先・現場で検索..." aria-label="現場名で検索">
                                            </div>
                                            <button type="button" class="cn-list-pick-btn" data-prefix="現場">
                                                <span class="cn-list-pick-label">一覧</span>
                                                <span class="cn-list-pick-clear" aria-label="選択解除">×</span>
                                            </button>
                                        </div>
                                        <div class="cn-filter-chips" data-axis="site">
                                            <button type="button" class="cn-filter-chip is-active" data-filter="all">すべて</button>
                                            <button type="button" class="cn-filter-chip" data-filter="add">追加</button>
                                            <button type="button" class="cn-filter-chip" data-filter="modify">変更</button>
                                            <button type="button" class="cn-filter-chip" data-filter="delete">削除</button>
                                        </div>
                                    </div>
                                    <div class="cn-body cn-body--history" id="wsCnHistorySiteBody">
                                        <div class="cn-empty">変更履歴はありません</div>
                                    </div>
                                    <div class="cn-pick-view" data-crumb-base="現場" data-step1-label="契約先を選択">
                                        <div class="cn-pick-head">
                                            <button type="button" class="cn-pick-back" aria-label="戻る">←</button>
                                            <div class="cn-pick-crumbs">
                                                <span>現場</span>
                                                <span class="cn-pick-crumb-sep">&gt;</span>
                                                <span class="cn-pick-crumb-current">契約先を選択</span>
                                            </div>
                                        </div>
                                        <div class="cn-pick-step is-active" data-step="company">
                                            <div class="cn-pick-badges" id="wsCnPickCompanyBadges"></div>
                                        </div>
                                        <div class="cn-pick-step" data-step="site">
                                            <div id="wsCnPickSiteBadgesGroups"></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="cn-history-view" data-view="account">
                                    <div class="cn-history-toolbar">
                                        <div class="cn-search-row">
                                            <div class="cn-search">
                                                <input type="text" placeholder="アカウントで検索..." aria-label="アカウントで検索">
                                            </div>
                                            <button type="button" class="cn-list-pick-btn" data-prefix="アカウント">
                                                <span class="cn-list-pick-label">一覧</span>
                                                <span class="cn-list-pick-clear" aria-label="選択解除">×</span>
                                            </button>
                                        </div>
                                        <div class="cn-filter-chips" data-axis="account">
                                            <button type="button" class="cn-filter-chip is-active" data-filter="all">すべて</button>
                                            <button type="button" class="cn-filter-chip" data-filter="add">追加</button>
                                            <button type="button" class="cn-filter-chip" data-filter="modify">変更</button>
                                            <button type="button" class="cn-filter-chip" data-filter="delete">削除</button>
                                        </div>
                                    </div>
                                    <div class="cn-body cn-body--history" id="wsCnHistoryAccountBody">
                                        <div class="cn-empty">変更履歴はありません</div>
                                    </div>
                                    <div class="cn-pick-view" data-crumb-base="アカウント" data-step1-label="アカウントを選択">
                                        <div class="cn-pick-head">
                                            <button type="button" class="cn-pick-back" aria-label="戻る">←</button>
                                            <div class="cn-pick-crumbs">
                                                <span>アカウント</span>
                                                <span class="cn-pick-crumb-sep">&gt;</span>
                                                <span class="cn-pick-crumb-current">アカウントを選択</span>
                                            </div>
                                        </div>
                                        <div class="cn-pick-step is-active" data-step="account">
                                            <div class="cn-pick-badges" id="wsCnPickAccountBadges"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- メインエリア -->
        <div class="md-ws-main">
            <!-- グリッド -->
            <div class="md-ws-grid-wrapper" id="wsGridWrapper">
                <div class="md-ws-grid" id="wsGrid">
                    <!-- JS で描画 -->
                </div>
            </div>

            <!-- サイドバー -->
            <div class="md-ws-sidebar">
                <div class="md-ws-sidebar-header">
                    <img src="mockup/icons/calendar.svg" alt="" style="width:16px;height:16px;filter:brightness(10);">
                    <span class="md-ws-sidebar-date" id="wsSidebarDate">4月9日</span>
                    <span class="md-ws-sidebar-dow" id="wsSidebarDow">(木)</span>
                    <span style="flex:1;"></span>
                    <span class="md-ws-employee-count" id="wsEmpCount"></span>
                </div>
                <div class="md-ws-sidebar-body" id="wsSidebarBody">
                    <!-- JS で描画 -->
                </div>
            </div>
        </div>
    </div>

    <!-- GCフィルタモーダルは共通ナビバー(co-navbar.js)に移動 -->

    <script src="mockup/demo-data.js?v=2"></script>
    <script src="mockup/notify-icons-selected.js?v=2"></script>
    <script src="mockup/co-notify-panel.js?v=12"></script>
    <script src="mockup/co-navbar.js?v=8"></script>
    <script src="mockup/weekly-schedule.js?v=2"></script>
</body>
</html>
