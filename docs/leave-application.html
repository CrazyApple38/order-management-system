<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>休暇申請管理 - 受注管理システム</title>
    <link rel="stylesheet" href="mockup/ds-tokens.css">
    <link rel="stylesheet" href="mockup/ds-legacy-aliases.css?v=1">
    <link rel="stylesheet" href="mockup/ds-components.css">
    <link rel="stylesheet" href="mockup/co-forms.css">
    <link rel="stylesheet" href="mockup/co-buttons.css">
    <link rel="stylesheet" href="mockup/co-modal.css">
    <link rel="stylesheet" href="mockup/co-shared-badges.css">
    <link rel="stylesheet" href="mockup/co-navbar.css?v=4">
    <link rel="stylesheet" href="mockup/co-notify-panel.css?v=18">
    <link rel="stylesheet" href="mockup/leave-application.css?v=31">
    <link rel="stylesheet" href="mockup/la-ds.css?v=3">
</head>
<body>
    <!-- SVG icon sprite (CLAUDE.md アイコン運用ルール準拠) -->

    <!-- co-navbar.js が自動挿入 -->

    <div class="la-app md-la-container is-mode-leave" id="laContainer">
        <div class="toolbar" aria-label="休暇申請管理ツールバー">
            <span class="la-toolbar-title">休暇申請管理</span>
            <div class="seg la-view-tabs" role="tablist" aria-label="ビュー切替">
                <button type="button" role="tab" class="md-la-view-tab is-active" data-view="month" aria-selected="true">月間</button>
                <button type="button" role="tab" class="md-la-view-tab" data-view="week" aria-selected="false">週間</button>
                <button type="button" role="tab" class="md-la-view-tab" data-view="year" aria-selected="false">年間</button>
            </div>
            <div class="la-period-nav">
                <button type="button" class="icon-btn" id="laPrevBtn" title="前の期間" aria-label="前の期間">‹</button>
                <span class="md-la-month-label-lg" id="laMonthLabel">2026年5月</span>
                <button type="button" class="icon-btn" id="laNextBtn" title="次の期間" aria-label="次の期間">›</button>
                <button type="button" class="tool-btn" id="laTodayBtn">今日</button>
            </div>
            <div class="toolbar-spacer"></div>
            <div class="la-role-switcher is-mode-leave-only" id="laRoleSwitcher" role="group" aria-label="モック用ロール切替">
                <button type="button" class="md-la-role-btn" data-role="self">本人</button>
                <button type="button" class="md-la-role-btn is-active" data-role="dcp">DCP</button>
                <button type="button" class="md-la-role-btn" data-role="admin">管理</button>
            </div>
            <button type="button" class="tool-btn primary" id="laNewBtn"><svg class="ui-icon" aria-hidden="true"><use href="#ui-icon-plus"/></svg>新規申請</button>
            <button type="button" class="tool-btn" id="laCompactBtn" title="イニシャル圧縮表示">圧縮</button>
            <button type="button" class="tool-btn" id="laReportBtn" title="月次集計・CSV出力">集計</button>
            <button type="button" class="tool-btn" onclick="OmsMockStore.resetAndReload()" title="共通ダミーデータを初期状態に戻す">リセット</button>
        </div>

        <div class="workspace la-workspace">
            <aside class="rail" aria-label="休暇申請管理レール">
                <div class="md-la-mode-seg" role="tablist" aria-label="作業面切替">
                    <button type="button" class="md-la-mode-seg-btn is-active" data-mode="leave" role="tab" aria-selected="true">休暇</button>
                    <button type="button" class="md-la-mode-seg-btn" data-mode="vehicle" role="tab" aria-selected="false">車両</button>
                </div>
            </aside>

            <section class="main" aria-label="カレンダー">
                <div class="main-card">
                    <div class="main-head"><span class="main-title" id="laMainTitle">休暇カレンダー</span><span class="main-hint">申請を選択すると詳細を右プロパティに表示します。</span></div>
                    <div class="md-la-calendar-wrapper">
                        <div class="md-la-calendar" id="laCalendar"></div>
                        <div class="md-la-week md-la-hidden" id="laWeek"><div class="md-la-week-grid" id="laWeekGrid"></div></div>
                        <div class="md-la-year md-la-hidden" id="laYear"></div>
                        <div class="md-la-year-tooltip" id="laYearTooltip" role="tooltip" hidden></div>
                    </div>
                </div>
            </section>

            <aside class="prop" aria-label="休暇申請管理右プロパティ">
                <div class="prop-card">
                    <div class="md-la-mini-sidebar" id="laMiniSidebar">
                <div class="md-la-mini-cal" id="laMiniCal">
                    <div class="md-la-mini-cal-header">
                        <button type="button" class="md-la-mini-cal-nav" id="laMiniPrev" aria-label="前月">
                            <svg class="ui-icon" aria-hidden="true"><use href="#ui-icon-chevron-left"/></svg>
                        </button>
                        <span class="md-la-mini-cal-label" id="laMiniMonthLabel"></span>
                        <button type="button" class="md-la-mini-cal-nav" id="laMiniNext" aria-label="翌月">
                            <svg class="ui-icon" aria-hidden="true"><use href="#ui-icon-chevron-right"/></svg>
                        </button>
                    </div>
                    <div class="md-la-mini-cal-grid" id="laMiniCalGrid">
                        <!-- JS で描画 -->
                    </div>
                </div>
                    </div>
                    <div class="md-la-sidebar" id="laSidebar">
                        <div class="md-la-sidebar-panel">
                    <div class="md-la-sidebar-header">
                        <span class="md-la-sidebar-title" id="laSidebarTitle">社員</span>
                        <span class="md-la-sidebar-count" id="laSidebarCount"></span>
                        <!-- 車両モード時のみ: 車両追加ボタン -->
                        <button type="button" class="md-vs-add-vehicle-btn is-mode-vehicle-only" id="vsAddVehicleBtn" title="車両を追加">
                            <svg class="ui-icon" aria-hidden="true"><use href="#ui-icon-plus"/></svg>
                            車両追加
                        </button>
                    </div>
                    <div class="md-la-sidebar-search">
                        <input type="text" id="laSidebarSearch" placeholder="氏名で検索...">
                    </div>
                    <div class="la-prop-gc-filters" id="laPropGcFilters"></div>
                    <div class="md-la-sidebar-body" id="laSidebarBody">
                        <!-- JS で描画 -->
                    </div>
                    <div class="la-prop-dock" id="laPropDock"><div class="la-prop-empty">カレンダーの申請、または車両リストの編集を選択してください。</div></div>
                        </div>
                    </div>
                </div>
            </aside>

            <aside class="panel-rail" aria-label="右プロパティ切替">
                <button type="button" data-prop="detail" title="詳細" aria-label="詳細">詳細</button>
                <button type="button" class="active" data-prop="list" title="リスト" aria-label="リスト">リスト</button>
                <button type="button" data-prop="alerts" title="要対応" aria-label="要対応">要対応</button>
            </aside>
        </div>
    </div>

    <script src="mockup/mock-employees-data.js?v=1"></script>
    <script src="mockup/mock-vehicles-data.js?v=1"></script>
    <script src="mockup/mock-assignments-data.js?v=4"></script>
    <script src="mockup/demo-data.js?v=5"></script>
    <script src="mockup/notify-icons-selected.js?v=2"></script>
    <script src="mockup/co-notify-panel.js?v=39"></script>
    <script src="mockup/co-mock-store.js?v=5"></script>
    <script src="mockup/co-navbar.js?v=22"></script>
    <script src="mockup/leave-application.js?v=30"></script>
</body>
</html>
