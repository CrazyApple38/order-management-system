<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>休暇申請管理 - 受注管理システム</title>
    <link rel="stylesheet" href="mockup/co-tokens.css">
    <link rel="stylesheet" href="mockup/co-forms.css">
    <link rel="stylesheet" href="mockup/co-buttons.css">
    <link rel="stylesheet" href="mockup/co-modal.css">
    <link rel="stylesheet" href="mockup/co-shared-badges.css">
    <link rel="stylesheet" href="mockup/co-navbar.css?v=4">
    <link rel="stylesheet" href="mockup/co-notify-panel.css?v=2">
    <link rel="stylesheet" href="mockup/leave-application.css?v=29">
</head>
<body>
    <!-- SVG icon sprite (CLAUDE.md アイコン運用ルール準拠) -->
    <svg class="ui-icon-sprite" aria-hidden="true" focusable="false">
        <defs>
            <!-- caution: sign-mark/im-11908-chuui-maaku.svg -->
            <symbol id="ui-icon-caution" viewBox="0 0 512 512">
                <path d="M504.874,399.04l-224.96-379.52C274.554,10.2,264.794,4.48,254.074,4.48c-10.72,0-20.48,5.72-25.84,14.88 L3.274,399.04c-5.36,9.16-5.36,20.6,0,29.76c5.36,9.16,15.12,14.88,25.84,14.88h449.92c10.72,0,20.48-5.72,25.84-14.88 C510.234,419.64,510.234,408.2,504.874,399.04z M254.074,368.92c-13.76,0-24.88-11.12-24.88-24.88s11.12-24.88,24.88-24.88 c13.76,0,24.88,11.12,24.88,24.88S267.834,368.92,254.074,368.92z M278.954,264.2c0,13.76-11.12,24.88-24.88,24.88 c-13.76,0-24.88-11.12-24.88-24.88v-99.52c0-13.76,11.12-24.88,24.88-24.88c13.76,0,24.88,11.12,24.88,24.88V264.2z"/>
            </symbol>
            <!-- check: sign-mark/im-11451-chekku-maaku-no-muryou.svg -->
            <symbol id="ui-icon-check" viewBox="0 0 512 512">
                <polygon points="434.252,76.923 184.84,326.326 77.762,219.262 0,297.033 184.84,481.859 512,154.684"/>
            </symbol>
            <!-- close: sign-mark/im-11911-hosoi-batsu.svg -->
            <symbol id="ui-icon-close" viewBox="0 0 512 512">
                <polygon points="512,52.535 459.467,0.002 256.002,203.462 52.538,0.002 0,52.535 203.47,256.005 0,459.465 52.533,511.998 256.002,308.527 459.467,511.998 512,459.475 308.536,256.005"/>
            </symbol>
            <!-- plus: sign-mark/im-00105-purasu.svg -->
            <symbol id="ui-icon-plus" viewBox="0 0 512 512">
                <polygon points="512,224.5 287.5,224.5 287.5,0 224.5,0 224.5,224.5 0,224.5 0,287.5 224.5,287.5 224.5,512 287.5,512 287.5,287.5 512,287.5"/>
            </symbol>
            <!-- chevron-left: 矢印左 -->
            <symbol id="ui-icon-chevron-left" viewBox="0 0 512 512">
                <path d="M275.99,499.426L72.428,298.063C64.372,290.095,59.854,279.284,59.854,267.971 c0-11.312,4.518-22.14,12.573-30.091C88.85,221.459,115.665,221.608,132.102,238.226l128.955,130.351V42.328 C261.057,18.966,280.022,0,303.384,0c23.382,0,42.328,18.965,42.328,42.328V368.34l128.955-130.351 c16.438-16.618,43.252-16.767,59.864,0.33c16.612,16.438,16.758,43.252,0.328,59.875L333.496,499.555 C325.528,507.612,314.717,512.13,303.404,512.13C292.093,512.13,281.265,507.61,275.99,499.426z" transform="rotate(90 256 256)"/>
            </symbol>
            <!-- chevron-right: 矢印右 -->
            <symbol id="ui-icon-chevron-right" viewBox="0 0 512 512">
                <path d="M275.99,499.426L72.428,298.063C64.372,290.095,59.854,279.284,59.854,267.971 c0-11.312,4.518-22.14,12.573-30.091C88.85,221.459,115.665,221.608,132.102,238.226l128.955,130.351V42.328 C261.057,18.966,280.022,0,303.384,0c23.382,0,42.328,18.965,42.328,42.328V368.34l128.955-130.351 c16.438-16.618,43.252-16.767,59.864,0.33c16.612,16.438,16.758,43.252,0.328,59.875L333.496,499.555 C325.528,507.612,314.717,512.13,303.404,512.13C292.093,512.13,281.265,507.61,275.99,499.426z" transform="rotate(-90 256 256)"/>
            </symbol>
            <!-- bell: 通知ベル (シンプル表現) -->
            <symbol id="ui-icon-bell" viewBox="0 0 512 512">
                <path d="M256,480c26.51,0,48-21.49,48-48h-96C208,458.51,229.49,480,256,480z M438.66,347.31 C414.41,315.11,384,272.77,384,208c0-69.11-45.56-127.76-108.8-146.93c3.2-7.12,4.8-14.77,4.8-22.4C280,17.33,259.09,0,234.67,0 S192,17.33,192,40c0,7.63,1.6,15.28,4.8,22.4C133.56,80.24,88,138.89,88,208c0,64.77-30.41,107.11-54.66,139.31 C28.65,353.41,24,359.62,24,367.57C24,383.03,35.96,400,55.43,400h401.14c19.47,0,31.43-16.97,31.43-32.43 C488,359.62,483.35,353.41,438.66,347.31z"/>
            </symbol>
        </defs>
    </svg>

    <!-- co-navbar.js が自動挿入 -->

    <div class="md-la-container">
        <!-- ヘッダー -->
        <div class="md-la-header">
            <span class="md-la-header-title">休暇申請管理</span>

            <!-- 月見出し (Google型 大きめ・軽量フォント) -->
            <span class="md-la-month-label-lg" id="laMonthLabel">2026年4月</span>

            <!-- 旧ナビ (ボタン本体は左サイドバー / ミニカレンダーへ移動。ID 互換のため hidden 保持) -->
            <button class="md-la-nav-btn md-la-hidden" id="laPrevBtn" title="前月" aria-hidden="true">◀</button>
            <button class="md-la-nav-btn md-la-hidden" id="laNextBtn" title="翌月" aria-hidden="true">▶</button>

            <div class="md-la-header-spacer"></div>

            <!-- アクション -->
            <div class="md-la-header-actions">
                <!-- ロール切替 (モック) -->
                <div class="md-la-role-switcher" id="laRoleSwitcher">
                    <span class="md-la-role-label">ロール:</span>
                    <button class="md-la-role-btn" data-role="self" title="本人 (自分の申請のみ編集可)">本人</button>
                    <button class="md-la-role-btn is-active" data-role="dcp" title="所属GCのDCP (承認可能)">DCP</button>
                    <button class="md-la-role-btn" data-role="admin" title="管理者 (全権限)">管理</button>
                </div>
                <!-- 通知鈴 -->
                <div class="cn-anchor md-la-cn-anchor" id="laCnAnchor">
                    <button type="button" class="cn-trigger md-la-header-action md-la-notify-btn" id="laNotifyBtn" title="通知">
                        <svg class="ui-icon" aria-hidden="true"><use href="#ui-icon-bell"/></svg>
                        <span class="cn-trigger-badge" id="laNotifyCount" hidden>0</span>
                    </button>
                    <div class="cn-panel" id="laCnPanel">
                        <div class="cn-head">
                            <span class="cn-title">通知</span>
                            <button type="button" class="cn-mark-all">すべて既読にする</button>
                        </div>
                        <div class="cn-tabs">
                            <button type="button" class="cn-tab is-active" data-tab="latest">最新</button>
                            <button type="button" class="cn-tab" data-tab="history">履歴</button>
                        </div>
                        <!-- 最新タブ -->
                        <div class="cn-tab-view is-active" data-tab="latest">
                            <div class="cn-body cn-body--latest" id="laCnBody">
                                <div class="cn-empty">通知はありません</div>
                            </div>
                        </div>
                        <!-- 履歴タブ (縦サブタブ: 社員名 / アカウント) -->
                        <div class="cn-tab-view" data-tab="history">
                            <div class="cn-history-layout">
                                <div class="cn-side-tabs">
                                    <button type="button" class="cn-side-tab is-active" data-view="site">社員名</button>
                                    <button type="button" class="cn-side-tab" data-view="account">アカウント</button>
                                </div>
                                <div class="cn-history-main">
                                    <div class="cn-history-view is-active" data-view="site">
                                        <div class="cn-history-toolbar">
                                            <div class="cn-search-row">
                                                <div class="cn-search">
                                                    <input type="text" placeholder="社員名で検索..." aria-label="社員名で検索">
                                                </div>
                                                <button type="button" class="cn-list-pick-btn" data-prefix="社員">
                                                    <span class="cn-list-pick-label">一覧</span>
                                                    <span class="cn-list-pick-clear" aria-label="選択解除">×</span>
                                                </button>
                                            </div>
                                            <div class="cn-filter-chips" data-axis="site">
                                                <button type="button" class="cn-filter-chip is-active" data-filter="all">すべて</button>
                                                <button type="button" class="cn-filter-chip" data-filter="new">申請</button>
                                                <button type="button" class="cn-filter-chip" data-filter="approved">承認</button>
                                                <button type="button" class="cn-filter-chip" data-filter="rejected">却下</button>
                                            </div>
                                        </div>
                                        <div class="cn-body cn-body--history" id="laCnHistorySiteBody">
                                            <div class="cn-empty">履歴はありません</div>
                                        </div>
                                        <!-- 一覧選択 (会社 → 社員 2段階) -->
                                        <div class="cn-pick-view" data-crumb-base="社員" data-step1-label="会社を選択">
                                            <div class="cn-pick-head">
                                                <button type="button" class="cn-pick-back" aria-label="戻る">←</button>
                                                <div class="cn-pick-crumbs">
                                                    <span>社員</span>
                                                    <span class="cn-pick-crumb-sep">&gt;</span>
                                                    <span class="cn-pick-crumb-current">会社を選択</span>
                                                </div>
                                            </div>
                                            <div class="cn-pick-step is-active" data-step="company">
                                                <div class="cn-pick-badges" id="laCnPickCompanyBadges"></div>
                                            </div>
                                            <div class="cn-pick-step" data-step="site">
                                                <div id="laCnPickSiteBadgesGroups"></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="cn-history-view" data-view="account">
                                        <div class="cn-history-toolbar">
                                            <div class="cn-search-row">
                                                <div class="cn-search">
                                                    <input type="text" placeholder="アカウントで検索..." aria-label="アカウントで検索">
                                                </div>
                                                <button type="button" class="cn-list-pick-btn" data-prefix="アカウント">
                                                    <span class="cn-list-pick-label">一覧</span>
                                                    <span class="cn-list-pick-clear" aria-label="選択解除">×</span>
                                                </button>
                                            </div>
                                            <div class="cn-filter-chips" data-axis="account">
                                                <button type="button" class="cn-filter-chip is-active" data-filter="all">すべて</button>
                                                <button type="button" class="cn-filter-chip" data-filter="new">申請</button>
                                                <button type="button" class="cn-filter-chip" data-filter="approved">承認</button>
                                                <button type="button" class="cn-filter-chip" data-filter="rejected">却下</button>
                                            </div>
                                        </div>
                                        <div class="cn-body cn-body--history" id="laCnHistoryAccountBody">
                                            <div class="cn-empty">履歴はありません</div>
                                        </div>
                                        <div class="cn-pick-view" data-crumb-base="アカウント" data-step1-label="アカウントを選択">
                                            <div class="cn-pick-head">
                                                <button type="button" class="cn-pick-back" aria-label="戻る">←</button>
                                                <div class="cn-pick-crumbs">
                                                    <span>アカウント</span>
                                                    <span class="cn-pick-crumb-sep">&gt;</span>
                                                    <span class="cn-pick-crumb-current">アカウントを選択</span>
                                                </div>
                                            </div>
                                            <div class="cn-pick-step is-active" data-step="account">
                                                <div class="cn-pick-badges" id="laCnPickAccountBadges"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="md-la-header-action" id="laCompactBtn" title="イニシャル圧縮表示">圧縮</button>
                <button class="md-la-header-action" id="laReportBtn" title="月次集計・CSV出力">集計</button>
            </div>
        </div>

        <!-- メインエリア -->
        <div class="md-la-main">
            <!-- 左サイドバー: 新規申請 / 今日 / ミニカレンダー / ビュー切替 -->
            <aside class="md-la-mini-sidebar" id="laMiniSidebar">
                <!-- 新規申請 (メインアクション / Google Cal の Create 相当) -->
                <button type="button" class="md-la-create-btn" id="laNewBtn" title="新規申請">
                    <svg class="ui-icon" aria-hidden="true"><use href="#ui-icon-plus"/></svg>
                    <span>新規申請</span>
                </button>
                <!-- 今日 (ミニカレンダーの上) -->
                <button type="button" class="md-la-today-btn-side" id="laTodayBtn">今日</button>
                <!-- ミニカレンダー -->
                <div class="md-la-mini-cal" id="laMiniCal">
                    <div class="md-la-mini-cal-header">
                        <button type="button" class="md-la-mini-cal-nav" id="laMiniPrev" aria-label="前月">
                            <svg class="ui-icon" aria-hidden="true"><use href="#ui-icon-chevron-left"/></svg>
                        </button>
                        <span class="md-la-mini-cal-label" id="laMiniMonthLabel"></span>
                        <button type="button" class="md-la-mini-cal-nav" id="laMiniNext" aria-label="翌月">
                            <svg class="ui-icon" aria-hidden="true"><use href="#ui-icon-chevron-right"/></svg>
                        </button>
                    </div>
                    <div class="md-la-mini-cal-grid" id="laMiniCalGrid">
                        <!-- JS で描画 -->
                    </div>
                </div>
                <!-- ビュー切替 (月間/週間/年間 トグルグループ) -->
                <div class="md-la-view-tabs" role="tablist" aria-label="ビュー切替">
                    <button type="button" role="tab" class="md-la-view-tab is-active" data-view="month" aria-selected="true">月間</button>
                    <button type="button" role="tab" class="md-la-view-tab" data-view="week" aria-selected="false">週間</button>
                    <button type="button" role="tab" class="md-la-view-tab" data-view="year" aria-selected="false">年間</button>
                </div>
            </aside>
            <!-- カレンダー (月間) / 週間グリッド -->
            <div class="md-la-calendar-wrapper">
                <div class="md-la-calendar" id="laCalendar">
                    <!-- JS で描画 (月間ビュー) -->
                </div>
                <div class="md-la-week md-la-hidden" id="laWeek">
                    <div class="md-la-week-grid" id="laWeekGrid">
                        <!-- JS で描画 (週間ビュー) -->
                    </div>
                </div>
                <div class="md-la-year md-la-hidden" id="laYear">
                    <!-- JS で描画 (年間ビュー) -->
                </div>
            </div>

            <!-- 右サイドパネル -->
            <div class="md-la-sidebar" id="laSidebar">
                <!-- 縦タブ -->
                <div class="md-la-sidebar-vtabs">
                    <button class="md-la-sidebar-vtab is-active" data-tab="all" title="全社員">全員</button>
                    <button class="md-la-sidebar-vtab" data-tab="touo" title="東央警備">東央</button>
                    <button class="md-la-sidebar-vtab" data-tab="nikkei" title="Nikkei">Nikkei</button>
                    <button class="md-la-sidebar-vtab" data-tab="zennihon" title="全日本">全日本</button>
                    <button class="md-la-sidebar-vtab is-alerts" data-tab="alerts" title="要対応アラート">
                        要対応
                        <span class="md-la-sidebar-vtab-badge md-la-hidden" id="laAlertTabBadge">0</span>
                    </button>
                    <div style="flex:1;"></div>
                    <button class="md-la-sidebar-vtab" id="laSidebarToggle" title="折り畳み／展開">⇔</button>
                </div>
                <!-- パネル本体 -->
                <div class="md-la-sidebar-panel">
                    <div class="md-la-sidebar-header">
                        <span class="md-la-sidebar-title" id="laSidebarTitle">社員</span>
                        <span class="md-la-sidebar-count" id="laSidebarCount"></span>
                    </div>
                    <div class="md-la-sidebar-search">
                        <input type="text" id="laSidebarSearch" placeholder="氏名で検索...">
                    </div>
                    <div class="md-la-sidebar-body" id="laSidebarBody">
                        <!-- JS で描画 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 凡例 -->
        <div class="md-la-legend">
            <span class="md-la-legend-item">
                <span class="md-la-legend-chip kind-paid"></span>有給
            </span>
            <span class="md-la-legend-item">
                <span class="md-la-legend-chip kind-absent"></span>欠勤
            </span>
            <span class="md-la-legend-item">
                <span class="md-la-legend-chip kind-other"></span>その他
            </span>
            <span style="width:1px;height:12px;background:var(--divider);"></span>
            <span class="md-la-legend-item">
                <span class="md-la-legend-chip status-pending"></span>申請中（破線）
            </span>
            <span class="md-la-legend-item">
                <span class="md-la-legend-chip status-approved"></span>承認済（実線）
            </span>
            <span style="width:1px;height:12px;background:var(--divider);"></span>
            <span class="md-la-legend-item" style="color:var(--text-tertiary);font-style:italic;">
                Phase E1: 月間ビュー + D&amp;D 基盤のみ実装。詳細編集・承認・週年ビューは後続フェーズで拡張。
            </span>
        </div>
    </div>

    <script src="mockup/demo-data.js?v=2"></script>
    <script src="mockup/co-notify-panel.js?v=3"></script>
    <script src="mockup/co-navbar.js?v=5"></script>
    <script src="mockup/leave-application.js?v=9"></script>
</body>
</html>
